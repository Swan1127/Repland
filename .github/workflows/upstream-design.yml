name: Upstream design verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-design-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: upstream-design
    shell: bash

jobs:
  build-and-unit-test:
    name: Current development build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare verified CI source copy and check private fixture exclusion
        run: |
          bash ./prepare-ci-sources.sh
          test ! -e app/src/androidTest/assets/user-timetable.pdf
          test ! -e app/src/androidTest/assets/user-timetable.expected.txt
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Run the JVM suite and build Debug and unsigned Release
        # Release has no signingConfig; this verifies compilation, not distribution signing.
        run: bash ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Upload current development unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-design-unit-test-reports
          path: |
            upstream-design/app/build/reports/tests/testDebugUnitTest/
            upstream-design/app/build/test-results/testDebugUnitTest/
          retention-days: 14

  android-lint:
    name: Current development Android Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Prepare verified CI source copy and check private fixture exclusion
        run: |
          bash ./prepare-ci-sources.sh
          test ! -e app/src/androidTest/assets/user-timetable.pdf
          test ! -e app/src/androidTest/assets/user-timetable.expected.txt
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Lint Debug and Release
        run: bash ./gradlew --no-daemon :app:lintDebug :app:lintRelease
      - name: Upload current development Android Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-design-android-lint-reports
          path: |
            upstream-design/app/build/reports/lint-results-debug.*
            upstream-design/app/build/reports/lint-results-release.*
          retention-days: 14

  instrumented-test-api-26:
    name: Current development instrumented tests (API 26)
    needs: build-and-unit-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator
      - name: Prepare verified CI source copy and check private fixture exclusion
        run: |
          bash ./prepare-ci-sources.sh
          test ! -e app/src/androidTest/assets/user-timetable.pdf
          test ! -e app/src/androidTest/assets/user-timetable.expected.txt
          echo "::notice::Private PDF fixture is absent; its tests must report assumption skips."
      - name: Install compile SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Enable and verify KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::The runner must have read/write access to /dev/kvm for API 26 tests."
            exit 1
          fi
          "$ANDROID_HOME/emulator/emulator" -accel-check
      - name: Build current development app and test APKs
        run: bash ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Run all instrumented tests on a dedicated fresh emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 26
          target: google_apis
          arch: x86
          avd-name: repland-upstream-design-api-26
          force-avd-creation: true
          ram-size: 2048M
          disable-linux-hw-accel: 'false'
          emulator-options: -accel on -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          working-directory: upstream-design
          script: bash ./gradlew --no-daemon :app:connectedDebugAndroidTest
      - name: Verify and summarize private PDF assumption skips
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path("app/build/outputs/androidTest-results/connected").rglob("TEST-*.xml"))
          if not reports:
              print("No instrumented XML results were produced; see the preceding build or device failure.")
              raise SystemExit(0)
          cases = [case for report in reports for case in ET.parse(report).iter("testcase")]
          fixture_classes = {
              "com.swan1127.repland.data.importer.UserTimetableImportTest",
              "com.swan1127.repland.data.FullFeatureInstrumentedTest",
          }
          fixture_cases = [case for case in cases if case.get("classname") in fixture_classes]
          assert {case.get("classname") for case in fixture_cases} == fixture_classes, "Private PDF suites are missing from test discovery"
          assert all(case.find("skipped") is not None for case in fixture_cases), "Absent private PDF must produce explicit assumption skips"
          summary = (
              f"Instrumented cases: {len(cases)}. "
              f"Private PDF cases explicitly skipped: {len(fixture_cases)}. "
              "The private timetable was not supplied.\n"
          )
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as output:
              output.write(summary)
          PY
      - name: Upload current development instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-design-instrumented-test-reports-api-26
          path: |
            upstream-design/app/build/reports/androidTests/connected/
            upstream-design/app/build/outputs/androidTest-results/connected/
          retention-days: 14

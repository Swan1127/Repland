org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9 ships built-in Kotlin support and, by default, refuses any plugin that
# registers extra Kotlin source dirs through the kotlin.sourceSets DSL.
# KSP does exactly that to expose build/generated/ksp/<variant>/kotlin, so the
# guard must be relaxed for Room code generation to work. This is the officially
# documented escape hatch printed by AGP itself:
#   "To suppress this error, set android.disallowKotlinSourceSets=false"
android.disallowKotlinSourceSets=false

kotlin.code.style=official
